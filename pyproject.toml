[project]
name = "nova-assistant"
version = "0.1.0"
description = "Nova — a standalone offline talking assistant for Linux PCs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
hotkeys = ["python-xlib"]
zst = ["zstandard"]

[project.scripts]
nova = "nova.app:main"

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.setuptools.package-data]
nova = ["qml/*.qml", "assets/*"]
